name: pixiv_tool
description: A high-performance Pixiv desktop downloader.
publish_to: none
version: 2.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.28.2
  drift_flutter: ^0.2.6
  file_selector: ^1.0.3
  flutter_inappwebview: 6.1.5
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^9.2.4
  go_router: ^16.2.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.7.0
  drift_dev: ^2.28.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  msix: ^3.16.12

flutter:
  uses-material-design: true
  generate: true

msix_config:
  display_name: PixivTool
  publisher_display_name: PixivTool
  identity_name: io.github.pixivtool
  msix_version: 2.0.0.0
  os_min_version: 10.0.17763.0
  publisher: CN=PixivTool
  capabilities: internetClient
  architecture: x64
  output_name: PixivTool-windows-x64
  sign_msix: false
